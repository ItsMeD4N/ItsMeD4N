name: ASCII Profile Card

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest

    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            login: ItsMeD4N

            uptimeStart: 2021-01-01

            art:
              seed: daily
              width: 420
              columns: 42
              rows: 24
              scale: 2.4
              warp: 2.2
              bands: 3.2
              contrast: 2.8
              octaves: 4

            card:
              align: left
              lowercase: false

              lines:
                - { type: header, text: 'DAN' }

                - { type: kv, key: Role, value: 'Full Stack Developer' }
                - { type: kv, key: Website, value: 'itsmedan.dev' }
                - { type: kv, key: GitHub, value: '@ItsMeD4N' }

                - { type: blank }

                - { type: section, title: 'Tech Stack' }

                - { type: kv, key: Frontend, value: 'React • TypeScript • JavaScript' }
                - { type: kv, key: Backend, value: 'Node.js • Python • Go • Lua • Java • Haskell' }
                - { type: kv, key: Systems, value: 'C • C++ • C#' }

                - { type: blank }

                - { type: section, title: 'GitHub Stats' }

                - { type: kv, key: Repositories, value: '{repos}' }
                - { type: kv, key: Stars, value: '{stars}' }
                - { type: kv, key: Followers, value: '{followers}' }
                - { type: kv, key: Contributions, value: '{contributions}' }
                - { type: kv, key: Top Languages, value: '{topLanguages}' }

            layout:
              charWidthPx: 9.8
              columnGapPx: 20
              cornerRadiusPx: 15
              fontFamily: "'JetBrains Mono', 'Cascadia Code', Consolas, monospace"
              fontSizePx: 15
              paddingPx: 16
              rowHeightPx: 20
              ruleWidth: 54
              valueColumn: 18

            output:
              dark: dark_mode.svg
              light: light_mode.svg

            themes:
              dark:
                background: '#0d1117'
                text: '#e6edf3'
                key: '#58a6ff'
                value: '#f0f6fc'
                dots: '#6e7681'
                added: '#3fb950'
                deleted: '#f85149'

              light:
                background: '#ffffff'
                text: '#24292f'
                key: '#0969da'
                value: '#24292f'
                dots: '#8b949e'
                added: '#1a7f37'
                deleted: '#cf222e'
