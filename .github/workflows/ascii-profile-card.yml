name: ASCII Profile Card

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-card:
    runs-on: ubuntu-latest

    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            card:
              lines:
                - { type: header, text: 'Daniel Putra' }

                - { type: kv, key: Role, value: 'FiveM Developer' }
                - { type: kv, key: Stack, value: 'Lua • React • TypeScript' }

                - { type: section, title: 'GitHub Stats' }

                - { type: kv, key: Stars, value: '{stars}' }
                - { type: kv, key: Repositories, value: '{repos}' }
                - { type: kv, key: Followers, value: '{followers}' }
                - { type: kv, key: Contributions, value: '{contributions}' }

                - { type: section, title: 'Languages' }

                - { type: kv, key: Top, value: '{topLanguages}' }
